services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: estatestay
      POSTGRES_PASSWORD: estatestay
      POSTGRES_DB: estatestay
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estatestay -d estatestay"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - estatestay-postgres:/var/lib/postgresql/data
volumes:
  estatestay-postgres:
